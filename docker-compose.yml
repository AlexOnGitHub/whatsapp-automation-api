services:
  postgres:
    image: postgres:16
    container_name: whatsapp_automation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: whatsapp_automation_db
    ports:
      - '5433:5432'
    volumes:
      - whatsapp_automation_pgdata:/var/lib/postgresql/data

volumes:
  whatsapp_automation_pgdata:
